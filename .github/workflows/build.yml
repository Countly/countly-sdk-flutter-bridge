name: Build the SDK

# Declaring permissions replaces the default token scopes, so checkout needs `contents: read`.
permissions:
  contents: read

on:
  push:
    branches:
      - master
      - staging
  # No branch filter: feature work is reviewed in pull requests into integration branches.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first; the oldest Flutter analyzes the plugin alone, as the example needs a newer Dart.
  analyze:
    name: Analyze (Flutter ${{ matrix.flutter.label }})
    runs-on: ubuntu-latest
    # The beta channel warns early about the next stable release, so its failures do not fail the workflow.
    continue-on-error: ${{ matrix.flutter.channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        flutter:
          # 3.24's `flutter pub get --no-example` still loads the example's package config and fails.
          - { version: "3.24.0", channel: "stable", label: "3.24.0, the oldest checked", targets: "lib", pubGet: "dart pub get --no-example" }
          # An empty version means the newest release of the channel.
          - { version: "", channel: "stable", label: "latest stable", targets: "lib example", pubGet: "flutter pub get" }
          - { version: "", channel: "beta", label: "beta", targets: "lib example", pubGet: "flutter pub get" }
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter.version }}
          channel: ${{ matrix.flutter.channel }}
          cache: true

      - name: Report the toolchain
        run: flutter --version

      - name: Resolve the dependencies
        run: ${{ matrix.flutter.pubGet }}

      # Only errors and warnings fail; `--no-pub` skips the `flutter pub get` that fails on 3.24.
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos ${{ matrix.flutter.targets }}

  # The Dart suites under test/: the VM tests, then the web tests in the runner's Chrome, compiled to
  # JavaScript and to WebAssembly. Coverage and the CI report come from the latest stable only.
  test:
    name: Unit tests (Flutter ${{ matrix.flutter.label }})
    runs-on: ubuntu-latest
    needs: analyze
    continue-on-error: ${{ matrix.flutter.channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - { version: "3.24.0", channel: "stable", label: "3.24.0, the oldest checked", pubGet: "dart pub get --no-example", latest: false }
          - { version: "", channel: "stable", label: "latest stable", pubGet: "flutter pub get", latest: true }
          - { version: "", channel: "beta", label: "beta", pubGet: "flutter pub get", latest: false }
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter.version }}
          channel: ${{ matrix.flutter.channel }}
          cache: true

      - name: Resolve the dependencies
        run: ${{ matrix.flutter.pubGet }}

      - name: Run the VM tests
        run: flutter test --no-pub --coverage

      - name: Write the coverage summary
        if: matrix.flutter.latest
        run: |
          awk -F: '/^LF:/ { found += $2 } /^LH:/ { hit += $2 }
            END { printf "### Unit test coverage\n\n| Metric | Covered | Count |\n|---|---|---|\n| lines | %.2f%% | %d/%d |\n", (found ? 100 * hit / found : 0), hit, found }' \
            coverage/lcov.info > "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the CI report fragment (coverage)
        if: ${{ !cancelled() && matrix.flutter.latest }}
        run: |
          [ -s "$RUNNER_TEMP/coverage.md" ] || exit 0
          summary=$(awk '$2 == "lines" { print "Line coverage " $4 }' "$RUNNER_TEMP/coverage.md")
          mkdir -p "$RUNNER_TEMP/ci-report-coverage"
          {
            printf 'Coverage\n%s\n' "${summary:-See details}"
            cat "$RUNNER_TEMP/coverage.md"
          } > "$RUNNER_TEMP/ci-report-coverage/report.md"

      - name: Upload the CI report fragment (coverage)
        if: ${{ !cancelled() && matrix.flutter.latest }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-coverage
          path: ${{ runner.temp }}/ci-report-coverage
          if-no-files-found: ignore

      - name: Run the web tests
        run: flutter test --no-pub --platform chrome

      # The plugin supports `flutter build web --wasm`, so its web code is also tested compiled to WebAssembly.
      - name: Run the web tests compiled to WebAssembly
        if: matrix.flutter.latest
        run: flutter test --no-pub --platform chrome --wasm

  # What pub.dev will see: a missing LICENSE, an oversized archive or a dependency that cannot resolve.
  package:
    name: Package for pub.dev
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      # The vendored iOS SDK at its pinned version, the state a release is published from.
      - name: Prepare the vendored iOS SDK
        run: dart run scripts/sync_sdk_versions.dart

      # The dry run fails even on harmless warnings, so its output is checked instead of its exit code.
      - name: Dry run the publish
        run: flutter pub publish --dry-run 2>&1 | tee pub-dry-run.txt || true

      - name: Check what the archive would carry
        run: python3 .github/scripts/check_package_contents.py pub-dry-run.txt

      - name: Upload the dry run output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pub-dry-run
          path: pub-dry-run.txt
          if-no-files-found: warn

  build:
    name: Build the example (${{ matrix.target.name }})
    needs: analyze
    runs-on: ${{ matrix.target.os }}
    # A preview toolchain warns early, so its failures do not fail the workflow.
    continue-on-error: ${{ matrix.target.preview == true }}
    # SwiftPM rejects the example's local plugin override unless the plugin root is named countly_flutter_np.
    defaults:
      run:
        working-directory: countly_flutter_np
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "Android", os: "ubuntu-latest" }
          # Flutter uses SwiftPM by default from 3.44 and CocoaPods before or on opt-out, so both are built.
          - { name: "iOS (Swift Package Manager)", os: "macos-15" }
          - { name: "iOS (CocoaPods)", os: "macos-15" }
          # macos-15 builds with its default Xcode 16.4; these build with the newer Xcode versions apps move to.
          - { name: "iOS (Xcode 26)", os: "macos-26" }
          - { name: "iOS (Xcode 27 preview)", os: "xcode-27", preview: true }
          - { name: "Web", os: "ubuntu-latest" }
          - { name: "Web (WebAssembly)", os: "ubuntu-latest" }
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: countly_flutter_np

      # Gradle in the example needs a JDK 17 toolchain.
      - name: Set up Java
        if: matrix.target.name == 'Android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      # Both iOS integrations compile the vendored iOS SDK, so it is checked out first.
      - name: Prepare the vendored iOS SDK
        if: startsWith(matrix.target.name, 'iOS')
        run: dart run scripts/sync_sdk_versions.dart

      - name: Choose the iOS integration
        if: startsWith(matrix.target.name, 'iOS')
        run: |
          if [ "${{ matrix.target.name }}" = "iOS (CocoaPods)" ]; then
            flutter config --no-enable-swift-package-manager
          else
            flutter config --enable-swift-package-manager
          fi

      - name: Resolve the plugin dependencies
        run: flutter pub get

      - name: Report the toolchain
        run: |
          flutter --version
          if command -v xcodebuild >/dev/null; then xcodebuild -version; fi

      - name: Build the example
        working-directory: countly_flutter_np/example
        run: |
          case "${{ matrix.target.name }}" in
            Android)              flutter build apk --debug ;;
            iOS*)                 flutter build ios --simulator --no-codesign ;;
            "Web (WebAssembly)")  flutter build web --wasm ;;
            Web)                  flutter build web ;;
          esac

  # Versions come from scripts/config/sdk_versions.txt; this catches a hand edit to any file holding one.
  version-consistency:
    name: Versions are consistent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compare every file that carries a version
        run: python3 .github/scripts/check_version_consistency.py
