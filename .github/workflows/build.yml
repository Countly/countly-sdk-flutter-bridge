name: Build the SDK

# `contents: read` is what lets actions/checkout clone. Declaring any permissions block
# replaces the default token scopes outright rather than adding to them, so leaving it out
# drops read access to the repository itself.
permissions:
  contents: read

on:
  push:
    branches:
      - master
      - staging
  # No branch filter: feature branches are reviewed as pull requests into an integration
  # branch rather than into master, and those are exactly the runs worth having.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheapest signal, and the one everything else waits on: a Dart error should not cost
  # four platform builds. The plugin is analyzed on the oldest Flutter the CI checks as well,
  # because an API newer than that compiles fine for the developer who added it while
  # breaking every integrator who has not upgraded. The example requires a newer Dart than
  # that, so the oldest version analyzes the plugin alone.
  analyze:
    name: Analyze (Flutter ${{ matrix.flutter.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter:
          - { version: "3.24.0", label: "3.24.0, the oldest checked", targets: "lib", pubGetArgs: "--no-example" }
          # An empty version means the newest release of the channel.
          - { version: "", label: "latest stable", targets: "lib example", pubGetArgs: "" }
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter.version }}
          channel: stable
          cache: true

      - name: Report the toolchain
        run: flutter --version

      - name: Resolve the dependencies
        run: flutter pub get ${{ matrix.flutter.pubGetArgs }}

      # `--no-fatal-infos` because the lint set in analysis_options.yaml reports style
      # preferences as infos across the example and the integration tests. Errors and
      # warnings still fail, which is what this gate is for.
      - name: Analyze
        run: flutter analyze --no-fatal-infos ${{ matrix.flutter.targets }}

  # What pub.dev will see. It catches a missing LICENSE, a bad description, an oversized
  # archive, a missing iOS SDK and a dependency that cannot resolve, none of which any build
  # step notices.
  package:
    name: Package for pub.dev
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Checks out the vendored iOS SDK at the pinned tag with the sparse checkout rules, the
      # same state a release is published from.
      - name: Prepare the vendored iOS SDK
        run: dart run scripts/sync_sdk_versions.dart

      # The dry run exits non-zero for any validation warning, including the long standing and
      # harmless one about checked in files that a `.gitignore` also matches, so its output is
      # kept and judged rather than its exit code.
      - name: Dry run the publish
        run: flutter pub publish --dry-run 2>&1 | tee pub-dry-run.txt || true

      - name: Check what the archive would carry
        run: python3 .github/scripts/check_package_contents.py pub-dry-run.txt

      - name: Upload the dry run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-dry-run
          path: pub-dry-run.txt
          if-no-files-found: warn

  build:
    name: Build the example (${{ matrix.target.name }})
    needs: analyze
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "Android", os: "ubuntu-latest" }
          # Flutter links the plugin through Swift Package Manager by default from 3.44 on, and
          # through CocoaPods before that or when an app opts out, so both integrations are built.
          - { name: "iOS (Swift Package Manager)", os: "macos-15" }
          - { name: "iOS (CocoaPods)", os: "macos-15" }
          - { name: "Web", os: "ubuntu-latest" }
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      # Gradle in the example needs a JDK 17 toolchain.
      - name: Set up Java
        if: matrix.target.name == 'Android'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Both iOS integrations compile every source under the plugin's target directory, so the
      # vendored iOS SDK has to be checked out with the sparse checkout rules first.
      - name: Prepare the vendored iOS SDK
        if: startsWith(matrix.target.name, 'iOS')
        run: dart run scripts/sync_sdk_versions.dart

      - name: Choose the iOS integration
        if: startsWith(matrix.target.name, 'iOS')
        run: |
          if [ "${{ matrix.target.name }}" = "iOS (CocoaPods)" ]; then
            flutter config --no-enable-swift-package-manager
          else
            flutter config --enable-swift-package-manager
          fi

      - name: Resolve the plugin dependencies
        run: flutter pub get

      - name: Build the example
        working-directory: example
        run: |
          case "${{ matrix.target.name }}" in
            Android) flutter build apk --debug ;;
            iOS*)    flutter build ios --simulator --no-codesign ;;
            Web)     flutter build web ;;
          esac

  # The no-push flavour (`countly_flutter_np`) is released from the staging-np branch, and
  # scripts/script.py is the generator that is supposed to reproduce it from this tree. This
  # runs it on a throwaway copy and checks what comes out, so the generator cannot rot again.
  no-push-flavour:
    name: Generate the no-push flavour
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generated in a copy so the checkout the other steps would use is left alone, and so a
      # half-finished generation cannot be mistaken for the real tree. The script asks for
      # confirmation before it changes anything.
      - name: Generate the flavour
        run: |
          set -euo pipefail
          cp -R "$GITHUB_WORKSPACE" /tmp/np
          cd /tmp/np/scripts
          echo y | python3 script.py

      - name: Check the generated flavour
        working-directory: /tmp/np
        run: |
          set -euo pipefail
          grep -q "^name: countly_flutter_np" pubspec.yaml
          grep -q "BUILDING_WITH_PUSH_DISABLED = true;" android/src/main/java/ly/count/dart/countly_flutter/CountlyFlutterPlugin.java
          grep -q "BUILDING_WITH_PUSH_DISABLED = true;" lib/src/countly_flutter.dart
          grep -q "BUILDING_WITH_PUSH_DISABLED = true;" ios/countly_flutter_np/Sources/countly_flutter_np/CountlyFlutterPlugin.m
          grep -q "COUNTLY_EXCLUDE_PUSHNOTIFICATIONS=1" ios/countly_flutter_np.podspec
          grep -q '.define("COUNTLY_EXCLUDE_PUSHNOTIFICATIONS")' ios/countly_flutter_np/Package.swift
          grep -q "SDK_NAME = 'dart-flutterbnp-web';" lib/src/web/plugin_config.dart
          if grep -q -i "firebase" android/src/main/java/ly/count/dart/countly_flutter/CountlyFlutterPlugin.java android/build.gradle; then
            echo "::error::the generated no-push flavour still references Firebase"
            exit 1
          fi

      - name: Analyze the generated flavour
        working-directory: /tmp/np
        run: |
          set -euo pipefail
          flutter pub get --no-example
          flutter analyze --no-fatal-infos lib

  # Every file that carries a version is generated from scripts/config/sdk_versions.txt by
  # scripts/sync_sdk_versions.dart. Nothing stops a hand edit to one of them, and the result is
  # an SDK that reports one version on the wire and another in the changelog.
  version-consistency:
    name: Versions are consistent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Compare every file that carries a version
        run: python3 .github/scripts/check_version_consistency.py
