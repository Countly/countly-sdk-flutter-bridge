name: Build the SDK

# Declaring permissions replaces the default token scopes, so checkout needs `contents: read`.
permissions:
  contents: read

on:
  push:
    branches:
      - master
      - staging
  # No branch filter: feature work is reviewed in pull requests into integration branches.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first; the oldest Flutter analyzes the plugin alone, as the example needs a newer Dart.
  analyze:
    name: Analyze (Flutter ${{ matrix.flutter.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter:
          # 3.24's `flutter pub get --no-example` still loads the example's package config and fails.
          - { version: "3.24.0", label: "3.24.0, the oldest checked", targets: "lib", pubGet: "dart pub get --no-example" }
          # An empty version means the newest release of the channel.
          - { version: "", label: "latest stable", targets: "lib example", pubGet: "flutter pub get" }
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter.version }}
          channel: stable
          cache: true

      - name: Report the toolchain
        run: flutter --version

      - name: Resolve the dependencies
        run: ${{ matrix.flutter.pubGet }}

      # Only errors and warnings fail; `--no-pub` skips the `flutter pub get` that fails on 3.24.
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos ${{ matrix.flutter.targets }}

  # The Dart suites under test/: the VM tests, then the web tests in the runner's Chrome.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve the dependencies
        run: flutter pub get

      - name: Run the VM tests
        run: flutter test --no-pub

      - name: Run the web tests
        run: flutter test --no-pub --platform chrome

  # What pub.dev will see: a missing LICENSE, an oversized archive or a dependency that cannot resolve.
  package:
    name: Package for pub.dev
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The vendored iOS SDK at its pinned version, the state a release is published from.
      - name: Prepare the vendored iOS SDK
        run: dart run scripts/sync_sdk_versions.dart

      # The dry run fails even on harmless warnings, so its output is checked instead of its exit code.
      - name: Dry run the publish
        run: flutter pub publish --dry-run 2>&1 | tee pub-dry-run.txt || true

      - name: Check what the archive would carry
        run: python3 .github/scripts/check_package_contents.py pub-dry-run.txt

      - name: Upload the dry run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-dry-run
          path: pub-dry-run.txt
          if-no-files-found: warn

  build:
    name: Build the example (${{ matrix.target.name }})
    needs: analyze
    runs-on: ${{ matrix.target.os }}
    # SwiftPM rejects the example's local plugin override unless the plugin root is named countly_flutter.
    defaults:
      run:
        working-directory: countly_flutter
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "Android", os: "ubuntu-latest" }
          # Flutter uses SwiftPM by default from 3.44 and CocoaPods before or on opt-out, so both are built.
          - { name: "iOS (Swift Package Manager)", os: "macos-15" }
          - { name: "iOS (CocoaPods)", os: "macos-15" }
          - { name: "Web", os: "ubuntu-latest" }
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4
        with:
          path: countly_flutter

      # Gradle in the example needs a JDK 17 toolchain.
      - name: Set up Java
        if: matrix.target.name == 'Android'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Both iOS integrations compile the vendored iOS SDK, so it is checked out first.
      - name: Prepare the vendored iOS SDK
        if: startsWith(matrix.target.name, 'iOS')
        run: dart run scripts/sync_sdk_versions.dart

      - name: Choose the iOS integration
        if: startsWith(matrix.target.name, 'iOS')
        run: |
          if [ "${{ matrix.target.name }}" = "iOS (CocoaPods)" ]; then
            flutter config --no-enable-swift-package-manager
          else
            flutter config --enable-swift-package-manager
          fi

      - name: Resolve the plugin dependencies
        run: flutter pub get

      - name: Build the example
        working-directory: countly_flutter/example
        run: |
          case "${{ matrix.target.name }}" in
            Android) flutter build apk --debug ;;
            iOS*)    flutter build ios --simulator --no-codesign ;;
            Web)     flutter build web ;;
          esac

  # Regenerates the no-push flavour, released from staging-np, with scripts/script.py and checks it.
  no-push-flavour:
    name: Generate the no-push flavour
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generated in a copy so a half-finished run cannot touch the checkout; the script asks to confirm.
      - name: Generate the flavour
        run: |
          set -euo pipefail
          cp -R "$GITHUB_WORKSPACE" /tmp/np
          cd /tmp/np/scripts
          echo y | python3 script.py

      - name: Check the generated flavour
        working-directory: /tmp/np
        run: |
          set -euo pipefail
          grep -q "^name: countly_flutter_np" pubspec.yaml
          grep -q "BUILDING_WITH_PUSH_DISABLED = true;" android/src/main/java/ly/count/dart/countly_flutter/CountlyFlutterPlugin.java
          grep -q "BUILDING_WITH_PUSH_DISABLED = true;" lib/src/countly_flutter.dart
          grep -q "BUILDING_WITH_PUSH_DISABLED = true;" ios/countly_flutter_np/Sources/countly_flutter_np/CountlyFlutterPlugin.m
          grep -q "COUNTLY_EXCLUDE_PUSHNOTIFICATIONS=1" ios/countly_flutter_np.podspec
          grep -q '.define("COUNTLY_EXCLUDE_PUSHNOTIFICATIONS")' ios/countly_flutter_np/Package.swift
          grep -q "SDK_NAME = 'dart-flutterbnp-web';" lib/src/web/plugin_config.dart
          if grep -q -i "firebase" android/src/main/java/ly/count/dart/countly_flutter/CountlyFlutterPlugin.java android/build.gradle; then
            echo "::error::the generated no-push flavour still references Firebase"
            exit 1
          fi

      - name: Analyze the generated flavour
        working-directory: /tmp/np
        run: |
          set -euo pipefail
          flutter pub get --no-example
          flutter analyze --no-fatal-infos lib

  # Versions come from scripts/config/sdk_versions.txt; this catches a hand edit to any file holding one.
  version-consistency:
    name: Versions are consistent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Compare every file that carries a version
        run: python3 .github/scripts/check_version_consistency.py
