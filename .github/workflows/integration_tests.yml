name: Integration tests

# Declaring permissions replaces the default token scopes, so checkout needs `contents: read`.
permissions:
  contents: read

on:
  push:
    branches:
      - master
      - staging
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The example's integration tests run through scripts/run_integration_tests.sh, which builds and starts the
# example app once per test file. Only the automatic categories run here: the light tests, and the server
# tests, which start their own server inside the app. The remote config tests need a real Countly server and
# the manual tests move the app to the background, so they stay local. Each platform's tests are split into
# shards that run in parallel.
jobs:
  android:
    name: Integration tests (Android, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Gradle in the example needs a JDK 17 toolchain.
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      # The hosted Linux runners support hardware acceleration once the runner user may open /dev/kvm.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve the example dependencies
        working-directory: example
        run: flutter pub get

      - name: Run the tests on an Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_integration_tests.sh --light --server --fresh --shard ${{ matrix.shard }}/4

      - name: Upload the test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-logs-android-${{ matrix.shard }}
          path: test_results/
          if-no-files-found: ignore

  ios:
    name: Integration tests (iOS, ${{ matrix.shard }}/4)
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      # The example compiles the vendored iOS SDK, so it is checked out first.
      - name: Prepare the vendored iOS SDK
        run: dart run scripts/sync_sdk_versions.dart

      - name: Resolve the example dependencies
        working-directory: example
        run: flutter pub get

      # The newest iPhone of the newest installed iOS runtime.
      - name: Boot an iOS simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.split("iOS-")[-1])]
          runtimes = sorted((r for r in devices if ".iOS-" in r and devices[r]), key=version)
          phones = [d for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])
          ')"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted

      - name: Run the tests on the iOS simulator
        run: bash scripts/run_integration_tests.sh --light --server --fresh --shard ${{ matrix.shard }}/4

      - name: Upload the test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-logs-ios-${{ matrix.shard }}
          path: test_results/
          if-no-files-found: ignore
