# Runs the plugin's native iOS layer on a real iPhone of the Countly Device Farm.
#
# A macOS runner builds an XCTest bundle from the plugin's Objective-C sources, the vendored iOS SDK and
# .github/farm/ios/CountlyFlutterDeviceTests.m, which calls the plugin the way Dart does. The farm's
# packaging script wraps it into a signed runner app, and the phone's agent runs it.
#
# The job joins the farm with a GitHub OIDC token as an iOS run ("countly-sdk-ios"). It needs:
#   - the repo secrets APPLE_CERT_P12, APPLE_CERT_PASSWORD and APPLE_PROFILE (the values countly-sdk-ios uses);
#     the test bundle reuses the runner bundle ID that profile signs, com.countly.CountlyTests.xctrunner
#   - this repository in the Command Center's CC_FARM_OIDC_REPOS (not in CC_FARM_SDKS, which would make it an Android run)
# .github/farm/client.mjs and package-xctest.sh are vendored from countly-sdk-tools, as in countly-sdk-ios.
name: Device tests (iOS)

on:
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ios:
    name: iOS real phone test
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FARM_URL: https://test-deniz.count.ly/command-center/farm
      RUNNER_BUNDLE_ID: com.countly.CountlyTests.xctrunner
    steps:
      - name: Check out the SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: sdk-src

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Prepare the vendored iOS SDK and the Flutter engine
        working-directory: sdk-src
        run: |
          dart run scripts/sync_sdk_versions.dart
          flutter precache --ios

      - name: Import the signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/farm.keychain-db"
          password="$(openssl rand -base64 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/1\)/{print $2; exit}')"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install the provisioning profile
        env:
          APPLE_PROFILE: ${{ secrets.APPLE_PROFILE }}
        run: |
          set -eu
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          echo "$APPLE_PROFILE" | base64 -d > "$dir/farm.mobileprovision"

      - name: Build the tests for a device
        run: |
          set -eu
          farm="$RUNNER_TEMP/farm"
          plugin="sdk-src/ios/countly_flutter/Sources/countly_flutter"
          mkdir -p "$farm/src" "$farm/Frameworks"
          cp sdk-src/.github/farm/ios/project.yml "$farm/"
          cp sdk-src/.github/farm/ios/*.m "$plugin"/*.h "$plugin"/*.m "$plugin"/include/countly_flutter/*.h "$farm/src/"
          cp "$plugin"/countly-sdk-ios/*.h "$plugin"/countly-sdk-ios/*.m "$farm/src/"
          engine="$(find "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios" -path '*Flutter.xcframework/ios-arm64*/Flutter.framework' -maxdepth 4 | head -1)"
          cp -R "$engine" "$farm/Frameworks/"
          brew install xcodegen
          (cd "$farm" && xcodegen generate)
          xcodebuild build-for-testing \
            -project "$farm/CountlyFlutterFarm.xcodeproj" -scheme CountlyTests \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd"

      - name: Package the signed runner
        run: |
          set -eu
          xctest="$(find "$RUNNER_TEMP/dd/Build/Products" -name CountlyTests.xctest -maxdepth 3 | head -1)"
          cp -R "$RUNNER_TEMP/farm/Frameworks/Flutter.framework" "$(dirname "$xctest")/"
          profile="$HOME/Library/MobileDevice/Provisioning Profiles/farm.mobileprovision"
          sdk-src/.github/farm/package-xctest.sh "$xctest" "$RUNNER_TEMP/pkg" "$SIGN_IDENTITY" "$profile"

      - name: Upload the test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-tests
          path: ${{ runner.temp }}/pkg/CountlyTests-Runner.ipa
          if-no-files-found: error

      - name: Join the device farm queue
        run: node sdk-src/.github/farm/client.mjs oidc countly-sdk-ios

      - name: Run the tests on the iPhone
        run: node sdk-src/.github/farm/client.mjs ios ios-tests "$RUNNER_BUNDLE_ID" "$RUNNER_TEMP/results/ios.xml"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore

      - name: Summarise the results
        if: always()
        run: node sdk-src/.github/farm/client.mjs summary "$RUNNER_TEMP/results" >> "$GITHUB_STEP_SUMMARY"

      - name: Give the phone back
        if: always()
        run: node sdk-src/.github/farm/client.mjs release "${{ job.status }}"
