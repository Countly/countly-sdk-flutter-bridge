group 'ly.count.dart.countly_flutter'
version '1.0'

buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'
    }
}

rootProject.allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'ly.count.dart.countly_flutter'
    }
    // Compile against the API level the host's Flutter SDK vends to plugins (Flutter 3.27+); older hosts get the fallback.
    compileSdk project.hasProperty('flutter') ? flutter.compileSdkVersion : 35

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'ly.count.android:sdk:26.8.0'
    implementation 'com.google.firebase:firebase-messaging:24.0.3'
}
